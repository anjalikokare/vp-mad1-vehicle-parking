<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    
       {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
   <div class="container d-flex justify-content-center">
      <div class="form-container my-5">
        <h3 class="text-center mb-4">User Registration</h3>
        <form method="POST" action = '/user_registration'>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control"  placeholder="Enter your name" name="name" id="name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control"  placeholder="Enter your email" name="email" id="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Enter your password" name="password" id="password" required>
          </div>
          <div class="mb-3">
            <label for="pincode" class="form-label">pincode</label>
            <input type="integer" class="form-control" placeholder="Enter your pincode" name="pincode" id="pincode" required>
          </div>
          <div class="mb-3">
      <label for="address" class="form-label">Address:</label>
      <textarea class="form-control" rows="2" name="address"></textarea>
    </div>
    <div class="text-center me-2 my-2">
          <button type="submit" class="btn btn-custom" style="width: 150px;">Register</button>
        </div>
         <div class='text-center'>
        <a href="/user_login" type="submit" class="text-decoration-none text-danger" style="font-weight: bold;">Login here</a>
            </div>
        </form>
      </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
  </body>
</html>
