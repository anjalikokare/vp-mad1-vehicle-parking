<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Release Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <div class="container d-flex justify-content-center">
      <div class="form-container my-5">
        <h3 class="text-center mb-4">Confirm Spot Release</h3>
        
        <form method="POST" action="{{ url_for('release_spot', reservation_id=reservation.id) }}">
          <div class="mb-3">
            <label class="form-label">Spot Name</label>
            <input type="text" class="form-control" value="{{ reservation.spot.spot_name }}" disabled>
          </div>

          <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" value="{{ reservation.spot.place }}" disabled>
          </div>

          <div class="mb-3">
            <label class="form-label">City</label>
            <input type="text" class="form-control" value="{{ reservation.spot.city }}" disabled>
          </div>

          <div class="mb-3">
            <label class="form-label">Vehicle Number</label>
            <input type="text" class="form-control" value="{{ reservation.vehicle_number }}" disabled>
          </div>

          <div class="text-center me-2 my-2">
            <button type="submit" class="btn btn-custom" style="width: 150px; background-color: #f8d7da; color: black; border: 1px solid red;">Release</button>
          </div>

          <div class="text-center">
            <a href="/user_dashboard" class="text-decoration-none text-danger">Go Back</a>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
  </body>
</html>
